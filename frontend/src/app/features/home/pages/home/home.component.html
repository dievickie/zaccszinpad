<div class="home-content">
  <section class="hero-minimal">
    <h1>{{ 'home.title' | translate }}</h1>
  </section>

  <section *ngIf="nextOccurrence as event" class="home-highlight">
    <div class="home-highlight__inner">
      <div class="home-highlight__text">
        <p class="home-highlight__label">
          amire készülünk
        </p>

        <h2 class="home-highlight__title">
          {{ event.seriesId === 'okulare' ? 'Okuláré' : '' }}
          – {{ event.title[currentLanguage] }}
        </h2>

        <p class="home-highlight__meta" *ngIf="event.startDate">
          {{ formatDate(event.startDate) }}
          <span *ngIf="event.city">
            – {{ event.city[currentLanguage] }}
          </span>
        </p>
      </div>

      <a
        class="button button--primary"
        [routerLink]="['/programok', event.seriesId]"
      >
        érdekel
      </a>
    </div>
  </section>
</div>
