<section class="works-page">
  <h1>{{ 'nav.works' | translate }}</h1>

  <div class="works-grid">
    <a
      *ngFor="let work of works"
      class="works-grid__link"
      [routerLink]="['/munkak', work.slug]"
    >
      <article class="work-card">
        <div class="work-card__image">
          <img
            [src]="work.cardImage || '/assets/images/placeholder.jpg'"
            [alt]="work.title[currentLanguage]"
            class="work-card__img"
            [class.work-card__img--placeholder]="!work.cardImage"
          />
        </div>

        <div class="work-card__content">
          <h2 class="work-card__title">
            {{ work.title[currentLanguage] }}
          </h2>        </div>
      </article>
    </a>
  </div>
</section>
